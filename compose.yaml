# Local PostgreSQL 16, matching production's major version.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: westray
      POSTGRES_PASSWORD: westray
      POSTGRES_DB: westray
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U westray -d westray"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
