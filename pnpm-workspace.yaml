# Packages allowed to run install scripts.
allowBuilds:
  esbuild: true
  '@parcel/watcher': true

# Refuse packages published less than a day ago (pnpm 12's default, stated here so
# every pnpm version that reads this file resolves the lockfile the same way).
minimumReleaseAge: 1440

# The rich-text library, pinned once: package.json and the override below both take
# it from this catalog, so the application and Publisher use the same commit.
catalog:
  '@nuxt4-layers/rich-text': github:nuxt4-layers/rich-text#68ac5b008e60ae0150171324eedeb22eb37110cc

# Publisher v1.0.0 takes the rich-text library from GitHub (pinned by tag), which
# pnpm refuses in a dependency's dependencies by default. Allowed only because the
# override below holds it to the catalog's commit; any other Git or tarball
# dependency still needs a reviewed change here.
blockExoticSubdeps: false
overrides:
  '@nuxt4-layers/rich-text': 'catalog:'
