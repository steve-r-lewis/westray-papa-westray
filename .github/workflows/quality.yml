name: Quality

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Markdown headings and local links
        run: python3 scripts/check_markdown.py

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Node 22 from the image; pnpm through corepack at the version package.json
    # pins. The image's corepack (0.34) predates pnpm 11+, so a newer one is installed.
    container: node:22-bookworm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: westray-papa-westray
          POSTGRES_PASSWORD: westray-papa-westray
          POSTGRES_DB: westray-papa-westray
        options: >-
          --health-cmd "pg_isready -U westray-papa-westray -d westray-papa-westray"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://westray-papa-westray:westray-papa-westray@postgres:5432/westray-papa-westray
      PLATFORM_SUPER_ADMIN_ID: 00000000-0000-4000-8000-000000000001
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      # Includes the canary leak tests and the demonstration's, each against the built
      # site on a database of its own, created beside DATABASE_URL's and dropped after.
      - name: Test
        run: pnpm test
      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed --update
      - name: Seed the demonstration content
        run: pnpm db:seed
        env:
          DEMO_MODE: "true"
      - name: Build
        run: pnpm build

  # Gate for the `quality` status check that the master ruleset requires of
  # every repository. It passes only when every check above has passed.
  quality:
    needs: [markdown, app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Checks passed."
